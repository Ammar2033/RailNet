[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railnet"
version = "0.1.0"
description = "RailNet — lossless topology-driven neural-network execution and PCIe accelerator research"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy"]
authors = [{ name = "RailNet Contributors" }]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
gemma = ["tokenizers"]
hf = ["tokenizers", "transformers", "torch"]
rtl = ["amaranth>=0.5", "yowasp-yosys"]

[project.urls]
Homepage = "https://github.com/Ammar2033/RailNet"
Issues = "https://github.com/Ammar2033/RailNet/issues"

[project.scripts]
railnet = "railnet.cli:main"

[tool.ruff]
line-length = 100
# research/experiments/ is preserved history against a pre-refactor API — not linted.
extend-exclude = ["research/experiments"]
force-exclude = true

[tool.ruff.lint]
# EXE002 fires only because the repo is developed on an exFAT volume that
# cannot store the Unix executable bit; git tracks every file as 0644.
ignore = ["EXE002"]

[tool.ruff.lint.per-file-ignores]
# Amaranth's DSL uses nested `with m.If(...)` / `with m.Case(...)` that must not
# be merged, and re-exports test fns by name.
"hardware/rtl/*" = ["SIM117"]
"tests/hardware/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.10"
# numpy call sites legitimately surface as Any; keep mypy for real errors only.
warn_return_any = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
